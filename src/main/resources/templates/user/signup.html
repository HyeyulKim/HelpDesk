<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="centered-page">
<div class="auth-card">
    <p class="auth-title">회원가입</p>
    <p class="auth-subtitle">HelpDesk 계정을 만들어보세요</p>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form class="auth-form" th:action="@{/user/signup}" th:object="${signupRequestDto}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" th:field="*{username}" placeholder="4~20자 아이디">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="4~30자 비밀번호">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="이름">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" placeholder="example@helpdesk.com">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-group">
            <label>가입 유형</label>
            <div class="radio-group">
                <label><input type="radio" th:field="*{role}" value="USER" checked> 요청자</label>
                <label><input type="radio" th:field="*{role}" value="AGENT"> 담당자</label>
            </div>
        </div>

        <button type="submit" class="btn-primary">가입하기</button>
    </form>

    <p class="auth-footer">
        이미 계정이 있으신가요? <a th:href="@{/user/login}">로그인</a>
    </p>
</div>
</div>
</body>
</html>
