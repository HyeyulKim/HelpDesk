<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="centered-page">
<div class="auth-card">
    <p class="auth-title">회원가입</p>
    <p class="auth-subtitle">HelpDesk 계정을 만들어보세요</p>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form class="auth-form" th:action="@{/user/signup}" th:object="${signupRequestDto}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" th:field="*{username}" placeholder="4~20자 아이디">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="4~30자 비밀번호">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="이름">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <!-- ===== 이메일 인증 영역 ===== -->
        <div class="form-group">
            <label for="email">이메일</label>

            <!-- 이미 인증 완료된 경우: 뱃지만 표시, 입력은 readonly -->
            <div th:if="${verifiedEmail != null and verifiedEmail == signupRequestDto.email}">
                <input type="email" id="email" th:field="*{email}" readonly style="background:#f4f6f8;">
                <p style="color:#15803d; font-size:12px; font-weight:600; margin:6px 0 0;">✓ 이메일 인증이 완료되었습니다.</p>
            </div>

            <!-- 아직 인증 안 된 경우: 이메일 입력 + 발송 버튼 -->
            <div th:unless="${verifiedEmail != null and verifiedEmail == signupRequestDto.email}">
                <div style="display:flex; gap:8px;">
                    <input type="email" id="email" th:field="*{email}" placeholder="example@helpdesk.com" style="flex:1;">
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

                <button type="submit" formaction="/user/signup/email/send" formmethod="post"
                        class="btn-outline" style="width:100%; margin-top:8px;">인증번호 발송</button>

                <p th:if="${emailSendError}" class="field-error" th:text="${emailSendError}"></p>
                <p th:if="${codeSent}" style="color:#2563eb; font-size:12px; margin:6px 0 0;">인증번호를 발송했습니다. 메일함을 확인해주세요. (5분 이내 유효)</p>

                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" name="code" placeholder="인증번호 6자리" maxlength="6" style="flex:1; height:42px; padding:0 14px; border:1px solid #dfe2e6; border-radius:8px; font-size:14px;">
                    <button type="submit" formaction="/user/signup/email/verify" formmethod="post"
                            class="btn-outline">확인</button>
                </div>
                <p th:if="${verifyError}" class="field-error" th:text="${verifyError}"></p>
                <p th:if="${emailVerifiedNow}" style="color:#15803d; font-size:12px; margin:6px 0 0;">✓ 인증되었습니다. 아래 '가입하기'를 눌러주세요.</p>
            </div>
        </div>
        <!-- ===== 이메일 인증 영역 끝 ===== -->

        <div class="form-group">
            <label>가입 유형</label>
            <div class="radio-group">
                <label><input type="radio" th:field="*{role}" value="USER" checked> 요청자</label>
                <label><input type="radio" th:field="*{role}" value="AGENT"> 담당자</label>
            </div>
        </div>

        <button type="submit" class="btn-primary">가입하기</button>
    </form>

    <p class="auth-footer">
        이미 계정이 있으신가요? <a th:href="@{/user/login}">로그인</a>
    </p>
</div>
</div>

<script th:inline="none">
    // 아이디/비밀번호/이름 입력칸에서 Enter를 눌러도 (의도치 않게 "인증번호 발송" 버튼이
    // 눌려버리는 걸 막기 위해) 폼이 제출되지 않게 한다. "인증번호 발송"/"확인"/"가입하기"는
    // 버튼을 직접 클릭했을 때만 동작한다.
    document.querySelectorAll('.auth-form input[type="text"], .auth-form input[type="password"], .auth-form input[type="email"]')
        .forEach(function (input) {
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });
        });
</script>
</body>
</html>
