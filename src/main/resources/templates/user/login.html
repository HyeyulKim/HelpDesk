<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="centered-page">
<div class="auth-card">
    <p class="auth-title">HelpDesk</p>

    <div th:if="${param.error}" class="alert alert-error">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div th:if="${param.signupSuccess}" class="alert alert-success">
        회원가입이 완료되었습니다. 로그인해주세요.
    </div>

    <form class="auth-form" th:action="@{/user/login}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <div style="display:flex; align-items:center; gap:10px; margin:20px 0;">
        <div style="flex:1; height:1px; background:#e5e7eb;"></div>
        <span style="font-size:12px; color:#9aa0a8;">또는</span>
        <div style="flex:1; height:1px; background:#e5e7eb;"></div>
    </div>

    <a th:href="@{/oauth2/authorization/google}"
       style="display:flex; align-items:center; justify-content:center; gap:8px; height:44px; border:1px solid #dfe2e6; border-radius:8px; text-decoration:none; color:#3d4148; font-size:14px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        Google로 로그인
    </a>

    <p class="auth-footer">
        아직 계정이 없으신가요? <a th:href="@{/user/signup}">회원가입</a>
    </p>
</div>
</div>
</body>
</html>
