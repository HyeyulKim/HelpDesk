<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="centered-page">
<div class="auth-card">
    <p class="auth-title">HelpDesk</p>

    <div th:if="${param.error}" class="alert alert-error">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div th:if="${param.signupSuccess}" class="alert alert-success">
        회원가입이 완료되었습니다. 로그인해주세요.
    </div>

    <form class="auth-form" th:action="@{/user/login}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <p class="auth-footer">
        아직 계정이 없으신가요? <a th:href="@{/user/signup}">회원가입</a>
    </p>
</div>
</div>
</body>
</html>
