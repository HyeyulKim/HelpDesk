<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>문의 수정 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">HelpDesk</a>
    <div class="navbar-right">
        <a class="nav-link" th:href="@{/requests}">문의함</a>
        <a class="nav-link" th:href="@{/mypage}">마이페이지</a>
        <a class="nav-link" th:href="@{/statistics}" sec:authorize="hasRole('AGENT')">통계</a>
        <span class="navbar-user" sec:authorize="isAuthenticated()">
            <span sec:authentication="name"></span>님
        </span>
        <form th:action="@{/user/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-outline">로그아웃</button>
        </form>
    </div>
</nav>

<div class="page-container">

    <div class="page-header">
        <h2 class="page-title">문의 수정</h2>
        <a class="btn-outline" th:href="@{/requests/{id}(id=${requestId})}" style="text-decoration:none;">취소</a>
    </div>

    <form class="auth-form" th:action="@{/requests/{id}/edit(id=${requestId})}" th:object="${requestCreateDto}" method="post">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" placeholder="문의 제목을 입력하세요">
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" th:field="*{content}" rows="10"
                      placeholder="문의 내용을 자세히 작성해주세요"
                      style="padding: 10px 14px; border: 1px solid #dfe2e6; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; background:#fff;"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </div>

        <div class="form-group">
            <label>우선순위</label>
            <div class="radio-group">
                <label><input type="radio" th:field="*{priority}" value="URGENT"> 긴급</label>
                <label><input type="radio" th:field="*{priority}" value="NORMAL"> 보통</label>
                <label><input type="radio" th:field="*{priority}" value="LOW"> 낮음</label>
            </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 160px;">저장하기</button>
    </form>

</div>

</body>
</html>
