<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${request.title} + ' - HelpDesk'">문의 상세 - HelpDesk</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">HelpDesk</a>
    <div class="navbar-right">
        <a class="nav-link" th:href="@{/requests}">문의함</a>
        <a class="nav-link" th:href="@{/mypage}">마이페이지</a>
        <a class="nav-link" th:href="@{/statistics}" sec:authorize="hasRole('AGENT')">통계</a>
        <span class="navbar-user" sec:authorize="isAuthenticated()">
            <span sec:authentication="name"></span>님
        </span>
        <form th:action="@{/user/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-outline">로그아웃</button>
        </form>
    </div>
</nav>

<div class="page-container">

    <div class="page-header">
        <h2 class="page-title" th:text="${request.title}"></h2>
        <a class="btn-outline" th:href="@{/requests}">목록으로</a>
    </div>

    <div class="detail-meta">
        <span class="badge"
              th:classappend="'badge-' + ${#strings.toLowerCase(request.status.name())}"
              th:text="${request.status.name() == 'WAITING'} ? '대기' : (${request.status.name() == 'IN_PROGRESS'} ? '처리중' : '완료')">
        </span>
        <span class="badge"
              th:classappend="'badge-' + ${#strings.toLowerCase(request.priority.name())}"
              th:text="${request.priority.name() == 'URGENT'} ? '긴급' : (${request.priority.name() == 'NORMAL'} ? '보통' : '낮음')">
        </span>
    </div>

    <dl class="detail-info-grid">
        <dt>요청자</dt>
        <dd th:text="${request.requesterName}"></dd>
        <dt>담당자</dt>
        <dd th:text="${request.assigneeName} ?: '미배정'"></dd>
        <dt>등록일</dt>
        <dd th:text="${#temporals.format(request.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
        <dt>수정일</dt>
        <dd th:text="${#temporals.format(request.updatedAt, 'yyyy-MM-dd HH:mm')}"></dd>
    </dl>

    <div class="detail-content" th:text="${request.content}"></div>

    <div class="attachment-section">
        <p class="section-title">첨부파일 <span class="comment-count" th:text="${#lists.size(attachments)}"></span></p>

        <ul class="attachment-list" th:if="${not #lists.isEmpty(attachments)}">
            <li class="attachment-item" th:each="file : ${attachments}">
                <a class="attachment-name"
                   th:href="@{/requests/{rid}/attachments/{aid}/download(rid=${request.requestId},aid=${file.attachmentId})}"
                   th:text="${file.originalFilename}"></a>
                <span class="attachment-size" th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1)} + ' KB'"></span>
                <form th:if="${currentUserId == request.requesterId}"
                      th:action="@{/requests/{rid}/attachments/{aid}/delete(rid=${request.requestId},aid=${file.attachmentId})}"
                      method="post" onsubmit="return confirm('첨부파일을 삭제하시겠습니까?');">
                    <button type="submit" class="comment-action-btn comment-action-danger">삭제</button>
                </form>
            </li>
        </ul>
        <p class="attachment-empty" th:if="${#lists.isEmpty(attachments)}">첨부된 파일이 없습니다.</p>

        <form th:if="${currentUserId == request.requesterId}"
              th:action="@{/requests/{id}/attachments(id=${request.requestId})}"
              method="post" enctype="multipart/form-data" class="attachment-upload-form">
            <input type="file" name="files" multiple>
            <button type="submit" class="btn-outline">업로드</button>
        </form>
    </div>

    <div class="detail-actions">
        <a th:if="${currentUserId == request.requesterId and request.status.name() == 'WAITING'}"
           class="btn-outline" th:href="@{/requests/{id}/edit(id=${request.requestId})}">수정</a>

        <form th:if="${currentUserRole.name() == 'AGENT' and request.status.name() != 'DONE'}"
              th:action="@{/requests/{id}/status(id=${request.requestId})}" method="post">
            <button type="submit" class="btn-outline">
                <span th:if="${request.status.name() == 'WAITING'}">처리 시작 (처리중으로 변경)</span>
                <span th:if="${request.status.name() == 'IN_PROGRESS'}">처리 완료 (완료로 변경)</span>
            </button>
        </form>

        <form th:if="${currentUserId == request.requesterId}"
              th:action="@{/requests/{id}/delete(id=${request.requestId})}" method="post"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit" class="btn-danger">삭제</button>
        </form>
    </div>

    <div class="comment-section">
        <p class="comment-section-title">
            <i class="comment-icon"></i>댓글 <span class="comment-count" th:text="${#lists.size(comments)}"></span>
        </p>

        <div class="comment-list">
            <div class="comment-empty" th:if="${#lists.isEmpty(comments)}">
                아직 댓글이 없습니다. 첫 댓글을 남겨보세요.
            </div>

            <div class="comment-item" th:each="comment : ${comments}">

                <div class="comment-avatar" th:text="${#strings.substring(comment.authorName, 0, 1)}"></div>

                <div class="comment-body">
                    <div class="comment-view" th:id="'view-' + ${comment.commentId}">
                        <div class="comment-header">
                            <span class="comment-author" th:text="${comment.authorName}"></span>
                            <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>

                            <span class="comment-actions" th:if="${currentUserId == comment.authorId}">
                                <button type="button" class="comment-action-btn"
                                        th:onclick="'toggleCommentEdit(' + ${comment.commentId} + ', true)'">수정</button>
                            </span>
                            <form class="comment-actions"
                                  th:if="${currentUserId == comment.authorId}"
                                  th:action="@{/requests/{rid}/comments/{cid}/delete(rid=${request.requestId},cid=${comment.commentId})}"
                                  method="post" onsubmit="return confirm('댓글을 삭제하시겠습니까?');">
                                <button type="submit" class="comment-action-btn comment-action-danger">삭제</button>
                            </form>
                        </div>
                        <div class="comment-content" th:text="${comment.content}"></div>
                    </div>

                    <form class="comment-edit-form" th:id="'edit-' + ${comment.commentId}"
                          th:if="${currentUserId == comment.authorId}"
                          th:action="@{/requests/{rid}/comments/{cid}/edit(rid=${request.requestId},cid=${comment.commentId})}"
                          method="post" style="display:none;">
                        <textarea name="content" th:text="${comment.content}"></textarea>
                        <div class="comment-edit-actions">
                            <button type="button" class="comment-btn comment-btn-cancel"
                                    th:onclick="'toggleCommentEdit(' + ${comment.commentId} + ', false)'">취소</button>
                            <button type="submit" class="comment-btn comment-btn-save">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <form class="comment-composer"
              th:if="${currentUserId == request.requesterId or currentUserId == request.assigneeId}"
              th:action="@{/requests/{id}/comments(id=${request.requestId})}"
              th:object="${commentCreateDto}" method="post">
            <div class="comment-composer-name" th:text="${currentUserName}"></div>
            <textarea th:field="*{content}" placeholder="댓글을 남겨보세요"></textarea>
            <div class="comment-composer-actions">
                <button type="submit" class="comment-composer-submit">등록</button>
            </div>
        </form>
        <p class="comment-guard"
           th:unless="${currentUserId == request.requesterId or currentUserId == request.assigneeId}">
            이 문의의 요청자, 담당자만 댓글을 작성할 수 있습니다.
        </p>
    </div>

</div>

<script th:inline="none">
    function toggleCommentEdit(commentId, showEdit) {
        var viewEl = document.getElementById('view-' + commentId);
        var editEl = document.getElementById('edit-' + commentId);
        if (!viewEl || !editEl) return;
        viewEl.style.display = showEdit ? 'none' : 'block';
        editEl.style.display = showEdit ? 'block' : 'none';
    }
</script>

</body>
</html>
