server:
  port: 8080
  servlet:
    session:
      timeout: 20m

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13306/helpdesk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: scott
    password: kosa1004
    hikari:
      pool-name: HelpdeskHikariPool
      maximum-pool-size: 10      # 풀에 유지할 최대 커넥션 수
      minimum-idle: 2            # 유휴 상태로 유지할 최소 커넥션 수
      connection-timeout: 3000   # 커넥션 획득 대기 시간(ms) - 테스트용으로 짧게
      idle-timeout: 60000        # 유휴 커넥션 제거 시간(ms)
      max-lifetime: 1800000      # 커넥션 최대 생존 시간(ms)
  thymeleaf:
    cache: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # 파일 하나당 최대 크기
      max-request-size: 30MB   # 한 번에 올릴 수 있는 전체 요청 크기 (여러 파일 합산)

app:
  upload:
    dir: uploads   # 첨부파일이 실제로 저장될 디렉토리
  
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.helpdesk.user.domain

logging:
  level:
    "[com.helpdesk]": debug
    "[org.springframework.security]": debug
    "[com.zaxxer.hikari]": debug   # HikariCP 풀 생성/커넥션 획득 로그 확인용