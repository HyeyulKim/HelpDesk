// Spring Boot 2.7.3 -> Spring Framework 5.3.22, Spring Security 5.7.x 자동 적용
plugins {
	id 'org.springframework.boot' version '2.7.3'
	id 'io.spring.dependency-management' version '1.0.13.RELEASE'
	id 'java'
}

group = 'com.helpdesk'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'   // Java 11

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web / View
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'   // 이메일 인증 발송용
	implementation 'org.springframework.boot:spring-boot-starter-websocket'   // 실시간 알림(STOMP)용
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'   // 구글 로그인용
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'   // Thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Security (세션 + 쿠키 기반 Form Login)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'

	// Persistence: MyBatis 3.x (mybatis-spring-boot-starter 2.2.2 -> MyBatis 3.5.10)
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
	runtimeOnly 'mysql:mysql-connector-java:8.0.30'   // MySQL

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'

	// VS Code "Test Runner for Java" 확장이 JUnit Platform 5.10+를 요구하므로
	// Spring Boot 2.7.3 기본값(5.8.x)보다 명시적으로 올려서 버전 충돌 방지
	testImplementation platform('org.junit:junit-bom:5.10.2')
}

// Spring Boot의 dependency-management가 JUnit 버전을 다시 낮추지 않도록 강제 고정
ext['junit-jupiter.version'] = '5.10.2'

test {
	useJUnitPlatform()
}